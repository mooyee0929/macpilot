[project]
name = "macpilot"
version = "0.1.0"
description = "macOS computer-use MCP server for Claude Code: accessibility-tree snapshots with ref actions for headless multi-agent use, plus screenshots and mouse and keyboard control."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mooyee0929" }]
dependencies = [
    "mcp>=2.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-vision>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[project.scripts]
macpilot = "macpilot.cli:main"
macpilot-mcp = "macpilot.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
